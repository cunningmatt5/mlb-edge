<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MLB Edge</title>
  <link rel="stylesheet" href="styles.css?v=94" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo" aria-label="MLB Edge">
        <svg class="logo-icon" viewBox="0 0 22 22" width="22" height="22" fill="none" aria-hidden="true">
          <path d="M11 1 L21 11 L11 21 L1 11 Z" stroke="rgba(34,197,94,.70)" stroke-width="1.4" stroke-linejoin="round" fill="rgba(34,197,94,.07)"/>
          <circle cx="11" cy="19.6" r="1.5" fill="rgba(255,255,255,.88)"/>
          <circle cx="19.6" cy="11"  r="1.5" fill="rgba(255,255,255,.88)"/>
          <circle cx="11"   cy="2.4" r="1.5" fill="rgba(255,255,255,.88)"/>
          <circle cx="2.4"  cy="11"  r="1.5" fill="rgba(255,255,255,.88)"/>
          <circle cx="11"   cy="11"  r="1.8" fill="rgba(34,197,94,.80)"/>
        </svg>
        <div class="logo-wordmark">
          <span class="logo-mlb">MLB</span><span class="logo-edge">EDGE</span>
        </div>
      </div>
      <nav class="nav-tabs">
        <button class="nav-btn active" data-view="games">Games</button>
        <button class="nav-btn" data-view="edges">Edges</button>
        <button class="nav-btn" data-view="reversion">Reversion</button>
        <button class="nav-btn" data-view="performance">Performance</button>
        <button class="nav-btn" data-view="lab">Lab</button>
        <button class="nav-btn" data-view="support">Support</button>
      </nav>
    </div>
  </header>

  <main id="app">
    <div id="games-view"></div>
    <div id="edges-view" hidden></div>
    <div id="reversion-view" hidden></div>

    <div id="performance-view" hidden>
      <div class="subnav" data-parent="performance">
        <button class="subnav-btn active" data-sub="record">Live record</button>
        <button class="subnav-btn" data-sub="backtest">Historical</button>
        <button class="subnav-btn" data-sub="pitcher">Pitchers</button>
      </div>
      <div id="record-view"></div>
      <div id="backtest-view" hidden></div>
      <div id="pitcher-view" hidden></div>
    </div>

    <div id="lab-view" hidden>
      <div class="lab-banner">⚗ Exploratory tools — not validated betting edges. Props are −EV on 2026 hit-rates (live-odds validation in progress); Simulate was anti-predictive in backtest. Use to explore, not as a signal.</div>
      <div class="subnav" data-parent="lab">
        <button class="subnav-btn active" data-sub="props">Props</button>
        <button class="subnav-btn" data-sub="parlay">Parlay</button>
        <button class="subnav-btn" data-sub="simulate">Simulate</button>
      </div>
      <div id="props-view"></div>
      <div id="parlay-view" hidden></div>
      <div id="simulate-view" hidden></div>
    </div>

    <div id="support-view" hidden></div>
  </main>

  <script src="app.js?v=94"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
